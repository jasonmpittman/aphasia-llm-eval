schema_version: 1
task_id: ciu_scoring
title: Correct Information Unit (CIU) Scoring
category: discourse
version: "0.3.0"
description: >
  The model counts total words and Correct Information Units in a
  transcribed discourse sample.
references:
  - "Nicholas LE, Brookshire RH (1993). J Speech Hear Res 36(2):338-350."

gold:
  file: gold_ciu_scoring.txt
  parser: ciu_token_table

input:
  renderer: numbered_tokens
  optional_fields: [stimulus, duration_seconds]

prompt:
  system: |
    You are helping with a research evaluation of language models on aphasia
    discourse analysis. Apply the supplied Correct Information Unit rules
    exactly and consistently. Reply with the requested JSON object and nothing
    else. Do not explain your answer.
  user_template: |
    SCORE IN TWO PASSES.

    The numbered tokens and utterance boundaries are fixed. Do not merge,
    split, add, remove, or reorder tokens.

    PASS 1 — WORD IDENTIFICATION
    - Ignore speaker labels such as "PAR:", punctuation, pause marks, and CHAT
      transcription codes; they are not words.
    - Count every intelligible lexical word whose intended target is known in
      context. A counted word need not be accurate, relevant, informative, or
      grammatically correct.
    - Exclude non-lexical filled pauses such as "uh" and "um", unintelligible
      material, and "xxx".
    - Count intelligible repetitions, false starts, revisions, and correction
      attempts as words even when they will not count as CIUs.
    - Split contractions into their constituent words: for example, "it's" is
      "it is" and counts as two words. Split hyphenated compounds into their
      component words. Count auxiliary and main verbs separately.
    - In CHAT repair notation such as "school [: stool]", count only the
      participant's original production ("school"); use the target only to
      understand the intended meaning.

    Record the indices of every token counted as a word in word_indices.

    PASS 2 — CORRECT INFORMATION UNITS (CIUs)
    Evaluate only words counted in Pass 1. A CIU must be intelligible in
    context, accurate in relation to the stimulus or topic, and relevant to and
    informative about it. It need not be grammatically correct.

    Do not count a word as a CIU when it belongs to any of these cases:
    - It inaccurately portrays a name, referent, pronoun, number, action, or
      other aspect of the stimulus, or a grammatical error makes its meaning
      uncertain.
    - It is an unsuccessful sound-error correction attempt before the final
      attempt, a dead end, false start, revision, or commentary about a
      revision.
    - It repeats material without adding information.
    - It is the first use of a pronoun without an unambiguous referent.
    - It is vague or nonspecific, unnecessary for grammatical completeness,
      lacks a clear referent, and could have been more specific. Words such as
      "here" and "there" are CIUs when a clear referent has been established.
    - "so" or "then" is used indiscriminately as filler or a continuant rather
      than as a cohesive or temporal link.
    - A qualifier or modifier is unnecessary filler. Count it when it
      disambiguates the scene or expresses legitimate uncertainty.
    - It is part of an irrelevant filler phrase, irrelevant interjection, tag
      question, task commentary, performance commentary, or personal aside.
    - The word is "and". Never count "and" as a CIU.

    Count these as CIUs when they meet the core definition:
    - Informative words in incomplete utterances.
    - Words expressing legitimate uncertainty or a change in perception.
    - Morphological errors whose meaning remains clear.
    - A semantic error when CHAT notation or context makes the intended,
      accurate target clear; score the participant's original word rather than
      replacing it with the target.
    - Informal terms that convey information about the stimulus.
    - Plausible embellishments or morals consistent with the depicted events.
    - Each constituent of a contraction or hyphenated word and each auxiliary
      and main verb, when each constituent meets the CIU definition.

    Stimulus or topic:
    {stimulus}

    Numbered transcript tokens:
    {numbered_tokens}

    Return compact JSON with sorted, unique indices and no explanation:
    {{"word_indices": [<indices counted as words>], "ciu_indices": [<word indices counted as CIUs>]}}
    Every ciu_indices value must also appear in word_indices.

output:
  format: json
  schema:
    type: object
    required: [word_indices, ciu_indices]
    properties:
      token_count: {type: integer, minimum: 1}
      word_indices:
        type: array
        items: {type: integer, minimum: 1}
        uniqueItems: true
      ciu_indices:
        type: array
        items: {type: integer, minimum: 1}
        uniqueItems: true
    additionalProperties: false

derived:
  - {name: total_words, function: length, args: [word_indices]}
  - {name: ciu_count, function: length, args: [ciu_indices]}
  - {name: percent_ciu, function: percentage, args: [ciu_count, total_words]}
  - {name: ciu_per_minute, function: per_minute, args: [ciu_count, duration_seconds], optional: true}

comparison:
  type: ciu_token_labels
  fields: [total_words, ciu_count, percent_ciu]
  tolerance: {total_words: 0, ciu_count: 0, percent_ciu: 0.5}

headline: {stat: mean_abs_diff, field: ciu_count, better: lower}
