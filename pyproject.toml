[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aphasia-llm-eval"
version = "0.1.0"
description = "Compare language models on aphasia clinical research tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
  {name = "aphasia-llm-eval contributors"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Flask==3.1.3",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "numpy==2.3.2",
  "openpyxl==3.1.5",
  "python-dotenv==1.2.2",
  "PyYAML==6.0.2",
  "reportlab==4.4.3",
  "SQLAlchemy==2.0.43",
  "tiktoken==0.14.0",
  "waitress==3.0.2",
]

[project.urls]
Repository = "https://github.com/OWNER/aphasia-llm-eval"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aphasia_eval = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=aphasia_eval --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aphasia_eval"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
