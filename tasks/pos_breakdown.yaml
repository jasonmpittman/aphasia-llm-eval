schema_version: 1
task_id: pos_breakdown
title: Parts-of-Speech Breakdown
category: morphosyntax
version: "0.2.0"
description: >
  The model tags each numbered token of a transcript with one part-of-speech
  tag. The app derives the per-category breakdown.
references:
  - "Universal Dependencies UPOS tagset, https://universaldependencies.org"

gold:
  file: gold_pos_breakdown.txt
  parser: token_table

input:
  renderer: numbered_tokens

tagset: [ADJ, ADP, ADV, AUX, CCONJ, DET, INTJ, NOUN, NUM, PART, PRON, PROPN, PUNCT, SCONJ, SYM, VERB, X]

prompt:
  system: |
    You are helping with a research evaluation of language models on
    part-of-speech tagging of speech transcripts from people with aphasia.
    Reply with the requested JSON object and nothing else.
  user_template: |
    Tag every numbered token with exactly one Universal Dependencies v2 UPOS
    tag from this list:
    {tagset}

    Rules:
    - Use each word's syntactic role in context, even when the utterance is
      fragmentary or ungrammatical.
    - The numbered tokens are fixed. Do not merge, split, skip, add, or reorder
      them. Contractions have already been expanded when required by this
      dataset.
    - Tag filled pauses such as "um" and "uh" as INTJ.
    - Tag every intelligible repetition, false start, revision, and correction
      attempt according to its role at that occurrence.
    - Tag an intelligible neologism by its recoverable syntactic role. Use X
      only when the word class cannot be determined; tag unintelligible
      placeholders such as "xxx" as X.
    - For this English dataset, tag personal, possessive, existential, and
      relative pronouns as PRON. Tag articles and adnominal quantifiers as DET.
    - Tag forms of "be" as AUX when they are progressive auxiliaries, copulas,
      or existential copulas. Tag lexical verbs as VERB.
    - Tag infinitival "to" as PART and prepositional "to" as ADP. Tag English
      verbal particles as ADP or ADV according to their contextual use, not as
      PART.
    - Tag coordinating conjunctions such as "and" as CCONJ and subordinating
      conjunctions as SCONJ.
    - Speaker labels and transcription metadata are not tokens. Tag
      punctuation as PUNCT only if it appears as a numbered token.

    Tokens:
    {numbered_tokens}

    Return JSON: {{"tags": [{{"i": 1, "pos": "DET"}}, {{"i": 2, "pos": "NOUN"}}, ...]}}

output:
  format: json
  schema:
    type: object
    required: [tags]
    properties:
      tags:
        type: array
        items:
          type: object
          required: [i, pos]
          properties:
            i: {type: integer, minimum: 1}
            pos: {type: string}
    additionalProperties: true

derived:
  - {name: counts_by_pos, function: counts_by, args: [tags.pos]}
  - {name: noun_verb_ratio, function: ratio, args: [counts_by_pos.NOUN, counts_by_pos.VERB]}

comparison:
  type: token_tags
  tag_field: pos
  index_field: i
  breakdown: true

headline: {stat: token_agreement, better: higher}
